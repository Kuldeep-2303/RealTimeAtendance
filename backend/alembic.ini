# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# File template for migration names
# file_template = %%(rev)s_%%(slug)s

# Add current dir to sys.path
prepend_sys_path = .

# Path separator for multiple locations (default = os.pathsep)
path_separator = os

# Database URL - use environment variable
# Example: export DATABASE_URL="postgresql+psycopg2://user:password@localhost/dbname"
sqlalchemy.url = ${DATABASE_URL}


[post_write_hooks]
# Example hooks (black, ruff). Uncomment if needed.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
